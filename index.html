var output = document.getElementById("output");
var SOURCES = { gpt: { label: "GPT", field: "textGpt" } };

// only fetch text for sources that actually exist
var fetches = [];
BOOKS.forEach(function (b) {
  if (b.hasGpt) fetches.push(fetch(b.fileGpt).then(function (r) { return r.text(); }).then(function (text) { b.textGpt = text; }));
});
Promise.all(fetches).then(showList);

function showList() {
  var html = "";
  var lastCategory = null;
  BOOKS.forEach(function (b) {
    if (b.category !== lastCategory) {
      html += "<h2 class='font-serif font-semibold text-yellow-900 mt-6 mb-2'>" + b.category + "</h2>";
      lastCategory = b.category;
    }
    if (b.hasGpt) {
      var links = "";
      if (b.hasGpt) {
        links += "<a href='#' onclick='showBook(\"" + b.id + "\", \"gpt\");return false' " +
          "class='text-xs uppercase tracking-wide text-green-700 underline hover:text-green-900'>GPT</a>";
      }
      html += "<div class='flex items-center justify-between bg-white border border-yellow-200 rounded px-4 py-2 mb-1 text-yellow-900'>" +
        "<span>" + b.id + "</span>" +
        "<span class='space-x-3'>" + links + "</span></div>";
    } else {
      html += "<div class='flex items-center justify-between bg-yellow-50 border border-dashed border-yellow-200 rounded px-4 py-2 mb-1 text-gray-400'>" +
        "<span>" + b.id + "</span>" +
        "<span class='text-xs uppercase tracking-wide'>ei transkriboitu</span></div>";
    }
  });
  output.innerHTML = html;
}

function showBook(id, source, lineIndex) {
  var b = BOOKS.find(function (x) { return x.id === id; });
  var src = SOURCES[source];
  if (!b || !src || !b[src.field]) return;

  var lines = b[src.field].split("\n");
  var body = lines.map(function (l, i) {
    var escaped = escapeHtml(l);
    return i === lineIndex ? "<mark id='hit'>" + escaped + "</mark>" : escaped;
  }).join("\n");

  output.innerHTML =
    "<p class='mb-3'><a href='#' onclick='showList();return false' class='text-yellow-800 underline'>&larr; takaisin</a></p>" +
    "<h2 class='text-xl font-serif font-semibold mb-2 text-yellow-900'>" + b.id + " &middot; " + src.label + "</h2>" +
    "<p class='text-sm text-gray-500 mb-2'>" + b.category + "</p>" +
    "<pre class='bg-white border border-yellow-200 rounded p-4 text-sm'>" + body + "</pre>";

  if (lineIndex !== undefined) {
    var hit = document.getElementById("hit");
    if (hit) hit.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// simple fuzzy match: letters of the query must appear in order (case-insensitive)
function fuzzy(query, text) {
  query = query.toLowerCase();
  text = text.toLowerCase();
  var qi = 0;
  for (var i = 0; i < text.length && qi < query.length; i++) {
    if (text[i] === query[qi]) qi++;
  }
  return qi === query.length;
}

function search(query) {
  if (!query) { showList(); return; }
  var html = "";
  BOOKS.forEach(function (b) {
    Object.keys(SOURCES).forEach(function (source) {
      var src = SOURCES[source];
      if (!b[src.field]) return;
      var allLines = b[src.field].split("\n");
      var hits = [];
      allLines.forEach(function (l, i) {
        if (l.trim() && fuzzy(query, l)) hits.push(i);
      });
      if (hits.length) {
        html += "<h3 class='font-serif font-semibold mt-4 text-yellow-900'>" + b.id + " &middot; " + b.category + " &middot; " + src.label + "</h3><ul class='space-y-1'>";
        hits.forEach(function (i) {
          html += "<li><a href='#' onclick='showBook(\"" + b.id + "\", \"" + source + "\", " + i + ");return false' " +
            "class='block bg-white border border-yellow-200 rounded px-3 py-1 text-sm text-gray-800 hover:border-yellow-400 hover:shadow transition'>" +
            escapeHtml(allLines[i]) + "</a></li>";
        });
        html += "</ul>";
      }
    });
  });
  output.innerHTML = html || "<p class='text-gray-500'>Ei osumia.</p>";
}
